# Renovate owns update PRs; routine Dependabot version PRs are disabled.
# Keep GitHub vulnerability alerts enabled. Automatic security PRs are a separate repo setting.
---
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      major:
        update-types:
          - major
    labels:
      - dependencies
      - npm
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    groups:
      actions:
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/London
    groups:
      docker:
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies
      - docker
    open-pull-requests-limit: 0
